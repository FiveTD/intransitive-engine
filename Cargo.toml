[package]
name = "intransitive-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["bevy_dev_tools", "debug", "dynamic_linking"] }
cargo-watch = "8.5.3"
slotmap = "1.1.1"
strum = "0.28.0"
strum_macros = "0.28.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

